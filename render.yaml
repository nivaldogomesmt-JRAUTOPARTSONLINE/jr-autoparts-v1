services:
  - type: web
    name: jr-autoparts-api
    env: node
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://app.jrautopartsmt.com.br
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@jrautopartsmt.com.br
      - key: BOTCONVERSA_API_KEY
        sync: false
      - key: BOTCONVERSA_API_URL
        value: https://backend.botconversa.com.br/api/v1
      - key: WHATSAPP_FROM_NUMBER
        value: "5565992812000"
      - key: BOT_SECRET_TOKEN
        generateValue: true
